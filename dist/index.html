  <script>
    (() => {
      let choice = 'system';
      try { choice = localStorage.getItem('star41-theme') || 'system'; } catch {}
      const dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themeChoice = choice;
      let seen = false;
      try { seen = sessionStorage.getItem('star41-intro') === 'seen'; } catch {}
      if (!seen) document.documentElement.classList.add('intro-active');
      setTimeout(() => document.documentElement.classList.remove('intro-active'), 3000);
    })();
  </script>
  <link rel="preload" href="/assets/fonts/DM-Sans.ttf" as="font" type="font/ttf" crossorigin>
